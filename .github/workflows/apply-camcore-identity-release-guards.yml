name: Apply approved Jarvis identity and publishing guardrails

on:
  push:
    branches:
      - fix/camcore-identity-and-release-guards

permissions:
  contents: write

concurrency:
  group: apply-camcore-identity-release-guards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    name: Apply and validate approved remediation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply SHA-guarded approved patch
        run: python scripts/apply_camcore_identity_release_guards.py .

      - name: Render production Compose
        env:
          CAMCORE_AI_MICROSOFT_TENANT_ID: ci-tenant
          CAMCORE_AI_MICROSOFT_CLIENT_ID: ci-client
          CAMCORE_AI_MICROSOFT_CLIENT_SECRET: ci-client-secret
          CAMCORE_AI_OPENAI_API_KEY: ci-openai-key
          CAMCORE_AI_GATEWAY_API_KEY: ci-gateway-key
          CAMCORE_AI_WEBUI_SECRET_KEY: ci-webui-secret-00000000000000000000000000000000
          CAMCORE_AI_OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: ci-session-secret-000000000000000000000000000000
          CAMCORE_AI_OAUTH_CLIENT_INFO_ENCRYPTION_KEY: ci-client-info-secret-000000000000000000000000000
          CAMCORE_AI_PROXY_TRUSTED_CIDR: 172.30.0.0/16
        run: >-
          docker compose -f deploy/camcore/compose.yaml config --format json
          > /tmp/camcore-open-webui.json

      - name: Validate identity and publishing controls
        shell: python
        run: |
          import json
          from pathlib import Path

          rendered = json.loads(Path('/tmp/camcore-open-webui.json').read_text())
          env = rendered['services']['open-webui']['environment']
          settings = json.loads(env['DEFAULT_INTERFACE_SETTINGS'])
          system = settings['system']
          required_identity = (
              'authorised operational assistant',
              'Jayden Cameron',
              'does not own CamCore',
              'visibility gaps',
              'avoid double counting',
              'failed from cancelled or optional release workflows',
              'Declare RED only',
          )
          for marker in required_identity:
              assert marker in system, marker

          pypi = Path('.github/workflows/release-pypi.yml').read_text()
          assert 'workflow_dispatch:' in pypi
          assert 'CAMCORE_ENABLE_PYPI_PUBLISH' in pypi
          assert 'branches:' not in pypi

          docker = Path('.github/workflows/docker.yaml').read_text()
          assert "vars.CAMCORE_ENABLE_HELM_NOTIFY == 'true'" in docker
          assert "vars.CAMCORE_ENABLE_DOCKERHUB_PUBLISH == 'true'" in docker
          assert docker.count('CAMCORE_ENABLE_HELM_NOTIFY') == 1
          assert docker.count('CAMCORE_ENABLE_DOCKERHUB_PUBLISH') == 1

      - name: Remove one-time migration machinery
        run: |
          set -euo pipefail
          rm -f scripts/apply_camcore_identity_release_guards.py
          rm -f .github/workflows/apply-camcore-identity-release-guards.yml
          git diff --check

      - name: Commit validated remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes were produced." >&2
            exit 1
          fi
          git commit -m "fix: add Jarvis identity and guard optional publishing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
