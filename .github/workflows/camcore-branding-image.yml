name: Build CamCore branded Open WebUI

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/camcore/branding/**"
      - "deploy/camcore/BRANDING.md"
      - ".github/workflows/camcore-branding-image.yml"
  push:
    branches: [main]
    paths:
      - "deploy/camcore/branding/**"
      - "deploy/camcore/BRANDING.md"
      - ".github/workflows/camcore-branding-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: camcore-branding-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build branding overlay
    runs-on: ubuntu-latest
    env:
      UPSTREAM_IMAGE: ghcr.io/open-webui/open-webui:v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
      UPSTREAM_SOURCE_REVISION: d3e8bf3405e848cfba377814d0aa7ba7290e414d
      UPSTREAM_VERSION: 0.11.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify branding contract
        shell: bash
        run: |
          set -euo pipefail

          dockerfile=deploy/camcore/branding/Dockerfile
          css=deploy/camcore/branding/custom.css
          loader=deploy/camcore/branding/loader.js
          manifest=deploy/camcore/branding/camcore-manifest.json
          patcher=deploy/camcore/branding/patch_runtime.py
          patcher_test=deploy/camcore/branding/test_patch_runtime.py
          tool_patcher=deploy/camcore/branding/patch_tool_servers.py
          responses_patcher=deploy/camcore/branding/patch_openai_responses.py
          responses_test=deploy/camcore/branding/test_patch_openai_responses.py
          verifier=deploy/camcore/branding/verify_assets.py

          grep -Fq "FROM ${UPSTREAM_IMAGE}" "$dockerfile"
          grep -Fq "$UPSTREAM_SOURCE_REVISION" "$dockerfile"
          grep -Fq 'c652985eb0ada755c6a3940da5426d57c59b293a' "$dockerfile"
          grep -Fq 'https://camcore.au/assets/camcore-logo.png' "$dockerfile"
          grep -Fq 'camcore-patch-tool-servers.py' "$dockerfile"
          grep -Fq 'camcore-patch-openai-responses.py' "$dockerfile"
          grep -Fq '8e5f36f6b13021145449ff59cd95593650963921' "$verifier"
          grep -Fq '77b25f513e3bd501d6e2578b4c8bee73da0928e8' "$verifier"
          grep -Fq '5ec9b1ea22bd45c50ff159a5b4046eba424f67b6' "$verifier"
          grep -Fq '540a5b2a15dd3d9f830dd58555f6b653c12c5f29' "$verifier"

          for path in "$css" "$loader" "$manifest" "$patcher" "$patcher_test" "$tool_patcher" "$responses_patcher" "$responses_test" "$verifier" deploy/camcore/branding/camcore-mark.svg; do
            test -s "$path"
          done

          grep -Fq '#030709' "$css"
          grep -Fq '#071014' "$css"
          grep -Fq '#16d7e8' "$css"
          grep -Fq '#4aa8ff' "$css"
          grep -Fq '#auth-login-card' "$css"
          grep -Fq '#sidebar-webui-name' "$css"
          grep -Fq '#chat-input' "$css"
          grep -Fq '#splash-screen' "$css"
          grep -Fq "url('/static/camcore-logo.png')" "$css"
          grep -Fq 'Jarvis  |  CamCore AI' "$css"
          grep -Fq 'prefers-reduced-motion' "$css"

          grep -Fq "const PRODUCT_NAME = 'Jarvis | CamCore AI'" "$loader"
          grep -Fq "const MANIFEST = '/static/camcore-manifest.json'" "$loader"
          grep -Fq "localStorage.setItem('theme', 'dark')" "$loader"
          grep -Fq '"name": "Jarvis | CamCore AI"' "$manifest"
          grep -Fq '"theme_color": "#071014"' "$manifest"

          grep -Fq "Tools.get_tools_by_ids(tool_ids) if ENABLE_PLUGINS else {}" "$tool_patcher"
          grep -Fq "elif tool_id.startswith('server:') or ENABLE_PLUGINS:" "$tool_patcher"
          grep -Fq "responses_payload.pop('reasoning_effort', None)" "$responses_patcher"
          grep -Fq "responses_payload['store'] = False" "$responses_patcher"
          grep -Fq "include.append('reasoning.encrypted_content')" "$responses_patcher"
          grep -Fq '_attach_camcore_responses_replay' "$responses_patcher"

          # Runtime CSS/JS must not depend on the public CamCore website.
          ! grep -Eq 'https?://' "$css"
          ! grep -Eq 'https?://' "$loader"

      - name: Extract pinned upstream compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="$RUNNER_TEMP/camcore-upstream"
          test ! -e "$fixture_dir"
          mkdir -p "$fixture_dir/utils" "$fixture_dir/routers"

          docker pull "$UPSTREAM_IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$UPSTREAM_IMAGE")" = "$UPSTREAM_SOURCE_REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$UPSTREAM_IMAGE")" = "$UPSTREAM_VERSION"
          container_id="$(docker create "$UPSTREAM_IMAGE")"
          cleanup() {
            docker rm -f "$container_id" >/dev/null
          }
          trap cleanup EXIT

          docker cp "$container_id:/app/backend/open_webui/env.py" "$fixture_dir/env.py"
          docker cp "$container_id:/app/backend/open_webui/utils/tools.py" "$fixture_dir/utils/tools.py"
          docker cp "$container_id:/app/backend/open_webui/utils/middleware.py" "$fixture_dir/utils/middleware.py"
          docker cp "$container_id:/app/backend/open_webui/routers/openai.py" "$fixture_dir/routers/openai.py"

          test -s "$fixture_dir/env.py"
          test -s "$fixture_dir/utils/tools.py"
          test -s "$fixture_dir/utils/middleware.py"
          test -s "$fixture_dir/routers/openai.py"

          cleanup
          trap - EXIT

      - name: Verify guarded runtime identity patch
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/camcore-upstream/env.py" /tmp/camcore-env.py
          python deploy/camcore/branding/patch_runtime.py /tmp/camcore-env.py
          ! grep -Fq "WEBUI_NAME += ' (Open WebUI)'" /tmp/camcore-env.py
          grep -Fq "WEBUI_FAVICON_URL = '/static/favicon.png'" /tmp/camcore-env.py
          grep -Fq '# LICENSE covers this Open WebUI branding surface, including name, logo,' /tmp/camcore-env.py
          grep -Fq '# LICENSE covers this Open WebUI branding surface, including this favicon' /tmp/camcore-env.py
          CAMCORE_ENV_SOURCE="$RUNNER_TEMP/camcore-upstream/env.py" \
            python deploy/camcore/branding/test_patch_runtime.py

      - name: Verify guarded external OpenAPI patch
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/camcore-upstream/utils/tools.py" /tmp/camcore-tools.py
          cp "$RUNNER_TEMP/camcore-upstream/utils/middleware.py" /tmp/camcore-middleware.py
          python deploy/camcore/branding/patch_tool_servers.py \
            /tmp/camcore-tools.py \
            /tmp/camcore-middleware.py
          python -m py_compile /tmp/camcore-tools.py /tmp/camcore-middleware.py
          grep -Fq "Tools.get_tools_by_ids(tool_ids) if ENABLE_PLUGINS else {}" /tmp/camcore-tools.py
          grep -Fq "elif tool_id.startswith('server:') or ENABLE_PLUGINS:" /tmp/camcore-middleware.py

      - name: Verify guarded OpenAI Responses patch
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/camcore-upstream/routers/openai.py" /tmp/camcore-openai.py
          test -s /tmp/camcore-middleware.py
          python deploy/camcore/branding/patch_openai_responses.py \
            /tmp/camcore-openai.py \
            /tmp/camcore-middleware.py
          python -m py_compile /tmp/camcore-openai.py /tmp/camcore-middleware.py
          grep -Fq "responses_payload.pop('reasoning_effort', None)" /tmp/camcore-openai.py
          grep -Fq "responses_payload['reasoning'] = {'effort': reasoning_effort}" /tmp/camcore-openai.py
          grep -Fq "responses_payload['store'] = False" /tmp/camcore-openai.py
          grep -Fq "include.append('reasoning.encrypted_content')" /tmp/camcore-openai.py
          grep -Fq '_attach_camcore_responses_replay(tool_messages, full_output())' \
            /tmp/camcore-middleware.py
          export CAMCORE_OPENAI_SOURCE=/tmp/camcore-openai.py
          export CAMCORE_MIDDLEWARE_SOURCE=/tmp/camcore-middleware.py
          python deploy/camcore/branding/test_patch_openai_responses.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CamCore branding image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/camcore/branding/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/camcoreau/open-webui:camcore-${{ github.sha }}
            ghcr.io/camcoreau/open-webui:camcore-current
          labels: |
            org.opencontainers.image.title=Jarvis | CamCore AI
            org.opencontainers.image.description=CamCore product identity and visual layer for Open WebUI
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/camcoreau/open-webui
            au.camcore.brand.source.repository=camcoreau/camcore-websites
            au.camcore.brand.source.revision=c652985eb0ada755c6a3940da5426d57c59b293a
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          printf '%s\n' "ghcr.io/camcoreau/open-webui:camcore-${GITHUB_SHA}@${DIGEST}" | tee camcore-branding-image.txt

      - name: Publish immutable digest status
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=camcore-branding-image \
            -f description="$DIGEST" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload immutable image reference
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: camcore-branding-image
          path: camcore-branding-image.txt
          if-no-files-found: error
          retention-days: 14
