name: Validate CamCore Open WebUI deployment

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/camcore/**"
      - ".github/workflows/camcore-deployment.yml"
  push:
    branches: [main]
    paths:
      - "deploy/camcore/**"
      - ".github/workflows/camcore-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camcore-open-webui-deployment-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate production contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Render production compose
        env:
          CAMCORE_AI_MICROSOFT_TENANT_ID: ci-tenant
          CAMCORE_AI_MICROSOFT_CLIENT_ID: ci-client
          CAMCORE_AI_MICROSOFT_CLIENT_SECRET: ci-client-secret
          CAMCORE_AI_OPENAI_API_KEY: ci-openai-key
          CAMCORE_AI_GATEWAY_API_KEY: ci-gateway-key
          CAMCORE_AI_WEBUI_SECRET_KEY: ci-webui-secret-00000000000000000000000000000000
          CAMCORE_AI_OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: ci-session-secret-000000000000000000000000000000
          CAMCORE_AI_OAUTH_CLIENT_INFO_ENCRYPTION_KEY: ci-client-info-secret-000000000000000000000000000
          CAMCORE_AI_PROXY_TRUSTED_CIDR: 172.30.0.0/16
        run: >-
          docker compose -f deploy/camcore/compose.yaml config --format json
          > /tmp/camcore-open-webui.json

      - name: Enforce deployment contract
        shell: python
        run: |
          import json
          from pathlib import Path

          expected_image = "ghcr.io/camcoreau/open-webui:camcore-a3a424d79ecc8f525215af19eb82c2097cad8b13@sha256:a956985f17f9794d35350a02c7cf6ee83d43b53ab45e2792b320e85ab21fe64b"
          rendered = json.loads(Path("/tmp/camcore-open-webui.json").read_text())
          assert set(rendered["services"]) == {"open-webui"}
          service = rendered["services"]["open-webui"]
          env = service["environment"]

          assert service["image"] == expected_image
          assert "@sha256:" in service["image"], "production image must be digest pinned"
          assert "camcore-current" not in service["image"], "mutable branding tag is forbidden"
          assert "latest" not in service["image"]
          assert not service.get("ports"), "host ports are forbidden"
          assert service["expose"] == ["8080"]
          assert "ALL" in service["cap_drop"]
          assert "no-new-privileges:true" in service["security_opt"]
          assert service.get("privileged") in (None, False)
          assert service["healthcheck"]["test"]
          assert service["volumes"], "persistent data volume is required"
          assert set(service["networks"]) == {"proxy"}
          assert set(rendered["networks"]) == {"proxy"}
          assert rendered["networks"]["proxy"]["name"] == "npm-backend"

          required = {
              "WEBUI_URL": "https://ai.camcore.network",
              "WEBUI_NAME": "Jarvis | CamCore AI",
              "ENABLE_SIGNUP": "false",
              "ENABLE_INITIAL_ADMIN_SIGNUP": "false",
              "ENABLE_LOGIN_FORM": "false",
              "ENABLE_PASSWORD_AUTH": "false",
              "ENABLE_OAUTH": "true",
              "ENABLE_OAUTH_SIGNUP": "true",
              "ENABLE_OAUTH_ROLE_MANAGEMENT": "true",
              "OAUTH_ROLES_CLAIM": "roles",
              "OAUTH_ALLOWED_ROLES": "CamCore.AI.User,CamCore.AI.Admin",
              "OAUTH_ADMIN_ROLES": "CamCore.AI.Admin",
              "MICROSOFT_REDIRECT_URI": "https://ai.camcore.network/oauth/microsoft/callback",
              "MICROSOFT_OAUTH_SCOPE": "openid email profile offline_access",
              "OPENID_PROVIDER_URL": "https://login.microsoftonline.com/ci-tenant/v2.0/.well-known/openid-configuration",
              "ENABLE_OAUTH_ID_TOKEN_COOKIE": "false",
              "ENABLE_OAUTH_TOKEN_EXCHANGE": "false",
              "ENABLE_PROFILE_IMAGE_URL_FORWARDING": "false",
              "ENABLE_PERSISTENT_CONFIG": "false",
              "ENABLE_OPENAI_API": "true",
              "OPENAI_API_BASE_URL": "https://api.openai.com/v1",
              "OPENAI_API_KEY": "ci-openai-key",
              "ENABLE_RESPONSES_API_STATEFUL": "false",
              "ENABLE_BASE_MODELS_CACHE": "false",
              "ENABLE_OLLAMA_API": "false",
              "ENABLE_FORWARD_USER_INFO_HEADERS": "false",
              "BYPASS_MODEL_ACCESS_CONTROL": "true",
              "BYPASS_ADMIN_ACCESS_CONTROL": "false",
              "AIOHTTP_CLIENT_SESSION_TOOL_SERVER_SSL": "true",
              "SAFE_MODE": "true",
              "ENABLE_PLUGINS": "false",
              "ENABLE_API_KEYS": "false",
              "ENABLE_DIRECT_CONNECTIONS": "false",
              "ENABLE_CODE_EXECUTION": "false",
              "ENABLE_CODE_INTERPRETER": "false",
              "ENABLE_WEB_SEARCH": "false",
              "ENABLE_IMAGE_GENERATION": "false",
              "ENABLE_COMMUNITY_SHARING": "false",
              "USER_PERMISSIONS_CHAT_FILE_UPLOAD": "false",
              "USER_PERMISSIONS_CHAT_SHARE": "false",
              "USER_PERMISSIONS_CHAT_ALLOW_OPEN_SHARING": "false",
              "USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS": "false",
              "AUDIT_LOG_LEVEL": "METADATA",
              "OFFLINE_MODE": "true",
          }
          for key, value in required.items():
              assert env.get(key) == value, f"{key} must be {value!r}"

          assert "OLLAMA_BASE_URL" not in env

          openai_configs = json.loads(env["OPENAI_API_CONFIGS"])
          assert openai_configs == {
              "0": {
                  "enable": True,
                  "tags": [],
                  "prefix_id": "",
                  "model_ids": [],
                  "connection_type": "external",
                  "api_type": "responses",
                  "auth_type": "bearer",
                  "passthrough_params": [],
              }
          }

          tool_servers = json.loads(env["TOOL_SERVER_CONNECTIONS"])
          assert len(tool_servers) == 1
          tool_server = tool_servers[0]
          assert tool_server["type"] == "openapi"
          assert tool_server["url"] == "https://ai-tools.camcore.network"
          assert tool_server["path"] == "openapi.json"
          assert tool_server["spec_type"] == "url"
          assert tool_server["auth_type"] == "bearer"
          assert tool_server["key"] == "ci-gateway-key"
          assert tool_server["config"] == {
              "enable": True,
              "access_grants": [
                  {
                      "principal_type": "user",
                      "principal_id": "*",
                      "permission": "read",
                  }
              ],
          }
          assert tool_server["info"]["id"] == "camcore-operations"
          assert tool_server["info"]["name"] == "CamCore Operations"

          source = Path("deploy/camcore/compose.yaml").read_text().lower()
          assert "ports:" not in source
          assert "sk-proj-" not in source, "OpenAI API keys must never be committed"
          assert "ci-gateway-key" not in source, "gateway bearer secrets must never be committed"
          assert "http://camcore-ai-gateway:8100" not in source
          assert "camcore-ollama" not in source

          branding = Path("deploy/camcore/branding")
          for path in (
              branding / "Dockerfile",
              branding / "custom.css",
              branding / "loader.js",
              branding / "camcore-mark.svg",
              branding / "patch_openai_responses.py",
              branding / "test_patch_openai_responses.py",
              branding / "patch_tool_servers.py",
          ):
              assert path.is_file() and path.stat().st_size > 0, f"missing CamCore asset: {path}"

          patcher = (branding / "patch_tool_servers.py").read_text()
          assert "Tools.get_tools_by_ids(tool_ids) if ENABLE_PLUGINS else {}" in patcher
          assert "elif tool_id.startswith('server:') or ENABLE_PLUGINS:" in patcher

          responses_patcher = (branding / "patch_openai_responses.py").read_text()
          assert "responses_payload.pop('reasoning_effort', None)" in responses_patcher
          assert "responses_payload['store'] = False" in responses_patcher
          assert "responses_payload.pop('previous_response_id', None)" in responses_patcher
          assert "include.append('reasoning.encrypted_content')" in responses_patcher
          assert "_attach_camcore_responses_replay" in responses_patcher
          assert "and not responses_stream_seen" in responses_patcher
          assert "**_camcore_function_call_linkage(" in responses_patcher
          assert "enabled=responses_stream_seen" in responses_patcher
          assert "tool_calls.append(responses_api_tool_calls)" in responses_patcher
          assert "'input': _sanitize_responses_input_items(input_items)" in responses_patcher
          assert "def _sanitize_responses_payload_for_send" in responses_patcher
          assert "is_responses=is_responses" in responses_patcher
          assert "is_responses=True" in responses_patcher

          runbook = Path("deploy/camcore/README.md").read_text()
          assert "CAMCORE_AI_OPENAI_API_KEY" in runbook
          assert "CAMCORE_AI_GATEWAY_API_KEY" in runbook
          assert "ai-tools.camcore.network" in runbook
          assert "camcoreau/camcore-ai-gateway" in runbook
          assert "gateway is deployed by `camcoreau/jarvis`" not in runbook.lower()
          assert "ENABLE_RESPONSES_API_STATEFUL=false" in runbook
          assert "store=false" in runbook

      - name: Verify required inputs fail closed
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CAMCORE_AI_MICROSOFT_TENANT_ID
            CAMCORE_AI_MICROSOFT_CLIENT_ID
            CAMCORE_AI_MICROSOFT_CLIENT_SECRET
            CAMCORE_AI_OPENAI_API_KEY
            CAMCORE_AI_GATEWAY_API_KEY
            CAMCORE_AI_WEBUI_SECRET_KEY
            CAMCORE_AI_OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
            CAMCORE_AI_OAUTH_CLIENT_INFO_ENCRYPTION_KEY
            CAMCORE_AI_PROXY_TRUSTED_CIDR
          )

          for name in "${required[@]}"; do
            export "$name=ci-validation-value-0000000000000000000000000000"
          done

          for missing in "${required[@]}"; do
            unset "$missing"
            if docker compose -f deploy/camcore/compose.yaml config --quiet >/dev/null 2>&1; then
              echo "compose accepted missing required input: $missing" >&2
              exit 1
            fi
            export "$missing=ci-validation-value-0000000000000000000000000000"
          done
